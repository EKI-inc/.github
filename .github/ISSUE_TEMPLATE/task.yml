name: Task
description: Track a discrete unit of work, follow-up, fix, documentation update, or implementation step.
title: "Task: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for actionable work that has a clear owner, outcome, and completion condition.

        For early project routing, repository setup, IT/security review, or infrastructure decisions, use the Digital project / IT intake form instead.

  - type: input
    id: task-summary
    attributes:
      label: Task summary
      description: One sentence describing the work to complete.
      placeholder: "Example: Add deployed app URLs to the gallery summary table."
    validations:
      required: true

  - type: dropdown
    id: task-type
    attributes:
      label: Task type
      options:
        - Feature or enhancement
        - Bug fix
        - Documentation
        - Template or process
        - Data, model, dashboard, or report
        - Infrastructure, automation, or CI/CD
        - Cleanup or maintenance
        - Research / spike
        - Other
    validations:
      required: true

  - type: textarea
    id: task-description
    attributes:
      label: Task description
      description: Describe the work, context, and expected outcome. Include enough detail that another contributor can pick it up.
      placeholder: |
        What needs to change?
        Why does it matter?
        What should be true when this is done?
    validations:
      required: true

  - type: textarea
    id: linked-work
    attributes:
      label: Linked work
      description: Link related issues, PRs, project items, intake records, user stories, tickets, or source systems.
      placeholder: |
        Related to #
        Blocks #
        Intake issue:
        External ticket:
    validations:
      required: false

  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      options:
        - Not urgent
        - Useful soon
        - Needed for active work
        - Blocking work
        - Time-sensitive
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Level of effort
      options:
        - Not specified
        - Trivial
        - Small
        - Medium
        - Large
        - Unknown
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the conditions that must be met before this task is done.
      placeholder: |
        - [ ] The generated gallery includes deployed URLs in the summary table.
        - [ ] The generated output is reproducible from the builder.
        - [ ] Documentation explains where maintainers should update the source metadata.
    validations:
      required: true

  - type: textarea
    id: subtasks
    attributes:
      label: Subtasks
      description: Optional checklist for implementation steps.
      placeholder: |
        - [ ] Update source file
        - [ ] Run validation
        - [ ] Open PR
    validations:
      required: false

  - type: textarea
    id: review-needs
    attributes:
      label: Review needs
      description: Name reviewers, subject matter experts, files, behavior, or decisions needing careful review.
      placeholder: |
        Suggested reviewer(s):
        Files or decisions needing close review:
    validations:
      required: false

  - type: checkboxes
    id: risk-check
    attributes:
      label: Risk check
      options:
        - label: This may involve client-confidential, regulated, sensitive, or restricted data.
        - label: This may involve secrets, credentials, service accounts, tokens, or connection strings.
        - label: This may affect GitHub Actions, automation, deployments, hosting, databases, or IT-managed systems.
        - label: This may use LLMs, AI-assisted development, or AI-generated outputs.
        - label: None of the above are expected.

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Describe how the task should be checked before closing.
      placeholder: |
        Commands:
        Manual checks:
        Screenshots/previews:
    validations:
      required: false
