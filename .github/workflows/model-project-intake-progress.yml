name: Model project intake progress

on:
  workflow_call:

permissions:
  contents: write
  issues: write

concurrency:
  group: intake-progress-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  progress:
    if: >-
      contains(github.event.issue.labels.*.name, 'project-intake') ||
      startsWith(github.event.issue.title, 'Groundwater Modeling Project Intake:') ||
      (contains(github.event.issue.body, '### Client Name') &&
        contains(github.event.issue.body, '### Model Applications'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Assign intake issue, post summary, and update README
        run: python .github/scripts/model_project_intake_progress.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
